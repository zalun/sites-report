[project]
name = "sites-report"
version = "0.1.0"
description = "Daily/weekly/monthly site analytics reports from GA4, GSC, and Vercel"
readme = "README.md"
authors = [
    { name = "Piotr Zalewa", email = "zaloon@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "click>=8.1",
    "google-api-python-client>=2.100",
    "google-auth>=2.23",
    "google-analytics-data>=0.18",
    "httpx>=0.27",
    "matplotlib>=3.8",
    "jinja2>=3.1",
]

[project.scripts]
sites-report = "sites_report.cli:cli"

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.11",
    "ty>=0.0.1a7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "SIM", "RUF", "S110", "S112"]

[tool.ruff.lint.isort]
known-first-party = ["sites_report"]
